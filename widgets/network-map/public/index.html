<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* ---------------------------------------------------------- theme --
         Text, lines and the background come from Homey's own variables, so
         they follow the dashboard. The hop and quality colours are ours, the
         same as the settings page's, and Homey marks dark mode with the
         .homey-dark-mode class. */
      :root {
        --h0: #16202b;
        --h1: #0b7d60;
        --h2: #1d4ed8;
        --h3: #6d28d9;
        --h4: #be185d;
        --ghost: #7c8794;

        --q-good: #15803d;
        --q-fair: #8a5a00;
        --q-weak: #b03a00;
        --q-bad: #c0272d;
        --q-unknown: #6b7480;
      }

      .homey-dark-mode {
        --h0: #f0f6fc;
        --h1: #4dd4ac;
        --h2: #58a6ff;
        --h3: #bc8cff;
        --h4: #ff8fab;
        --ghost: #8b96a5;

        --q-good: #56d364;
        --q-fair: #e3b341;
        --q-weak: #f0883e;
        --q-bad: #ff7b72;
        --q-unknown: #7d8797;
      }

      html, body { height: 100%; margin: 0; overflow: hidden; }
      body { position: relative; color: var(--homey-text-color); }
      [hidden] { display: none !important; }

      #canvas { display: block; width: 100%; height: 100%; cursor: pointer; }

      .ring { fill: none; stroke: var(--homey-line-color-light); stroke-width: 1px; }

      .link { fill: none; stroke-linecap: round; }
      .link.q-good { stroke: var(--q-good); stroke-opacity: .55; }
      .link.q-fair { stroke: var(--q-fair); stroke-opacity: .75; }
      .link.q-weak { stroke: var(--q-weak); stroke-opacity: .9; }
      .link.q-bad { stroke: var(--q-bad); stroke-opacity: .95; }
      .link.q-unknown { stroke: var(--q-unknown); stroke-opacity: .7; stroke-dasharray: 3 3; }
      .link.dim { stroke-opacity: .12; }
      .link.onpath { stroke-opacity: 1; }

      .node .body { stroke: var(--homey-background-color); stroke-width: 1px; }
      .node .halo { fill: none; stroke-width: 1.5px; }
      .node .halo.q-weak { stroke: var(--q-weak); }
      .node .halo.q-bad { stroke: var(--q-bad); }
      .node.ghost .body { fill: none !important; stroke: var(--ghost); stroke-dasharray: 2 2; }
      .node.dim { opacity: .2; }
      .node.selected .body { stroke: var(--homey-text-color); stroke-width: 2px; }
      .node text {
        font-size: var(--homey-font-size-small); fill: var(--homey-text-color);
        text-anchor: middle; pointer-events: none; paint-order: stroke;
        stroke: var(--homey-background-color); stroke-width: 3px; stroke-linejoin: round;
      }
      .node.selected text { font-weight: var(--homey-font-weight-medium); }

      /* The tapped device, over the top edge of the map. */
      .caption {
        position: absolute; left: var(--homey-su-2); right: var(--homey-su-2); top: var(--homey-su-2);
        padding: var(--homey-su-1) var(--homey-su-2);
        border-radius: var(--homey-border-radius-small);
        background: var(--homey-background-color);
        border: var(--homey-line-light);
        font-size: var(--homey-font-size-small); line-height: var(--homey-line-height-small);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .caption b { font-weight: var(--homey-font-weight-medium); }

      /* Route links per grade, along the bottom edge. */
      .summary {
        position: absolute; left: var(--homey-su-2); right: var(--homey-su-2); bottom: var(--homey-su-2);
        display: flex; align-items: center; gap: var(--homey-su-3);
        font-size: var(--homey-font-size-small); line-height: var(--homey-line-height-small);
        font-variant-numeric: tabular-nums; pointer-events: none;
      }
      .summary .count { display: flex; align-items: center; gap: var(--homey-su-1); }
      .summary .updated { margin-left: auto; color: var(--homey-text-color-light); }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .dot.q-good { background: var(--q-good); }
      .dot.q-fair { background: var(--q-fair); }
      .dot.q-weak { background: var(--q-weak); }
      .dot.q-bad { background: var(--q-bad); }
      .dot.q-unknown { background: var(--q-unknown); }
      .q-text-good { color: var(--q-good); }
      .q-text-fair { color: var(--q-fair); }
      .q-text-weak { color: var(--q-weak); }
      .q-text-bad { color: var(--q-bad); }

      .message {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        padding: var(--homey-su-4); text-align: center;
        font-size: var(--homey-font-size-small); line-height: var(--homey-line-height-small);
        color: var(--homey-text-color-light);
      }
    </style>
  </head>

  <body class="homey-widget-full">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="caption" id="caption" hidden></div>
    <div class="summary" id="summary" hidden></div>
    <div class="message" id="message" hidden></div>

    <script type="text/javascript">
      'use strict';

      var SVG_NS = 'http://www.w3.org/2000/svg';

      var GRADE_LABEL = {
        good: 'Good', fair: 'Fair', weak: 'Weak', bad: 'Bad', unknown: 'Too little traffic',
      };

      /** Widget height per shape; a percentage is an aspect ratio of the width. */
      var HEIGHTS = { square: '100%', wide: '60%', tall: '140%' };

      // Space kept free for the counts along the bottom, in pixels.
      var SUMMARY_SPACE = 28;
      // A tap this close to a device selects it — a fingertip is far bigger than a dot.
      var TAP_RADIUS = 22;

      var state = {
        homey: null,
        settings: {},
        view: null,
        byAddr: {},
        selected: null,
        placed: [],
      };

      var svg = document.getElementById('canvas');

      function el(name, attrs) {
        var node = document.createElementNS(SVG_NS, name);
        if (attrs) Object.keys(attrs).forEach(function (k) { node.setAttribute(k, attrs[k]); });
        return node;
      }

      function css(name) {
        return getComputedStyle(document.body).getPropertyValue(name).trim();
      }

      function shortName(name) {
        return name.length > 22 ? name.slice(0, 21) + '…' : name;
      }

      function showMessage(text) {
        var box = document.getElementById('message');
        box.textContent = text;
        box.hidden = !text;
      }

      // ------------------------------------------------------------- data --

      function load() {
        var query = state.settings.ghosts ? '/?ghosts=1' : '/';
        return state.homey.api('GET', query)
          .then(function (view) {
            state.view = view;
            state.byAddr = {};
            view.nodes.forEach(function (n) { state.byAddr[n.addr] = n; });
            if (state.selected != null && !state.byAddr[state.selected]) state.selected = null;
            showMessage(view.nodes.length > 1 ? '' : 'No Zigbee devices yet.');
            if (view.error) showMessage('Controller reports: ' + view.error);
            render();
          })
          .catch(function (err) {
            // Keep the last map if there is one; a refresh that fails says so only
            // when there is nothing else to show.
            if (!state.view) showMessage('Could not read the Zigbee network: ' + ((err && err.message) || err));
          });
      }

      // ----------------------------------------------------------- render --

      function hopColor(n) {
        if (n.isGhost) return css('--ghost');
        return css('--h' + (n.hops == null ? 4 : n.hops));
      }

      /** Screen size scales the dots a little, so a large widget is not all empty space. */
      function sizeFactor(box) {
        return Math.max(0.8, Math.min(1.4, Math.min(box.width, box.height) / 320));
      }

      function radius(n, f) {
        if (n.shape === 'controller') return 9 * f;
        return (3.5 + Math.min(Math.sqrt(n.relays || 0) * 1.6, 5)) * f;
      }

      function shapePath(n, r) {
        if (n.shape === 'controller') {
          var pts = [];
          for (var i = 0; i < 10; i++) {
            var rr = i % 2 ? r * 0.45 : r;
            var a = (Math.PI / 5) * i - Math.PI / 2;
            pts.push((rr * Math.cos(a)).toFixed(2) + ',' + (rr * Math.sin(a)).toFixed(2));
          }
          return 'M' + pts.join('L') + 'Z';
        }
        if (n.shape === 'router') {
          var s = r * 0.92;
          return 'M' + (-s) + ',' + (-s) + 'h' + (2 * s) + 'v' + (2 * s) + 'h' + (-2 * s) + 'Z';
        }
        return 'M' + (-r) + ',0a' + r + ',' + r + ' 0 1,0 ' + (2 * r)
          + ',0a' + r + ',' + r + ' 0 1,0 ' + (-2 * r) + ',0Z';
      }

      function linkWidth(l, f) {
        if (!l.sample) return 1;
        return Math.min(0.6 + Math.log(l.sample + 1) / Math.LN10 * 0.7, 4) * f;
      }

      function labelVisible(n, onPath) {
        if (n.shape === 'controller' || onPath) return true;
        if (state.settings.labels === 'all') return true;
        return state.settings.labels === 'routers' && n.shape === 'router';
      }

      /**
       * Draws the whole map in screen pixels. The layout arrives in abstract
       * units; mapping it here rather than scaling one SVG group keeps the dots
       * and the text a readable size on any widget.
       */
      function render() {
        var view = state.view;
        svg.textContent = '';
        state.placed = [];
        if (!view || !view.nodes.length) return;

        var box = { width: svg.clientWidth, height: svg.clientHeight };
        if (!box.width || !box.height) return;
        var f = sizeFactor(box);
        var bottom = state.settings.summary ? SUMMARY_SPACE : 0;
        var pad = 14 * f;

        var xs = view.nodes.map(function (n) { return n.x; });
        var ys = view.nodes.map(function (n) { return n.y; });
        var minX = Math.min.apply(null, xs);
        var maxX = Math.max.apply(null, xs);
        var minY = Math.min.apply(null, ys);
        var maxY = Math.max.apply(null, ys);
        var k = Math.min(
          (box.width - 2 * pad) / Math.max(maxX - minX, 1),
          (box.height - 2 * pad - bottom) / Math.max(maxY - minY, 1)
        );
        var cx = box.width / 2 - k * (minX + maxX) / 2;
        var cy = (box.height - bottom) / 2 - k * (minY + maxY) / 2;
        var at = function (n) { return { x: cx + k * n.x, y: cy + k * n.y }; };

        var sel = state.selected != null ? state.byAddr[state.selected] : null;
        var onPath = {};
        var pathLinks = {};
        if (sel) {
          (sel.path || [sel.addr]).forEach(function (a) { onPath[a] = true; });
          onPath[sel.addr] = true;
          (sel.path || []).forEach(function (a, i, path) {
            if (i < path.length - 1) pathLinks[a + '->' + path[i + 1]] = true;
          });
        }

        var rings = el('g');
        view.rings.forEach(function (r) {
          rings.appendChild(el('circle', {
            class: 'ring', cx: cx, cy: cy, r: r * k,
          }));
        });
        svg.appendChild(rings);

        var links = el('g');
        view.links.forEach(function (l) {
          var s = state.byAddr[l.source];
          var t = state.byAddr[l.target];
          if (!s || !t) return;
          var a = at(s);
          var b = at(t);
          var on = !!pathLinks[l.source + '->' + l.target];
          links.appendChild(el('line', {
            class: 'link q-' + l.grade + (on ? ' onpath' : sel ? ' dim' : ''),
            x1: a.x, y1: a.y, x2: b.x, y2: b.y,
            'stroke-width': linkWidth(l, f),
          }));
        });
        svg.appendChild(links);

        // The selected route is drawn last, so it stays on top of its neighbours.
        var nodes = view.nodes.slice().sort(function (a, b) {
          return (onPath[a.addr] ? 1 : 0) - (onPath[b.addr] ? 1 : 0);
        });
        var layer = el('g');
        nodes.forEach(function (n) {
          var p = at(n);
          var r = radius(n, f);
          var classes = 'node' + (n.isGhost ? ' ghost' : '');
          if (sel && n.addr === sel.addr) classes += ' selected';
          else if (sel && !onPath[n.addr]) classes += ' dim';
          var g = el('g', { class: classes, transform: 'translate(' + p.x + ',' + p.y + ')' });
          if (n.grade === 'weak' || n.grade === 'bad') {
            g.appendChild(el('circle', { class: 'halo q-' + n.grade, r: r + 3 * f }));
          }
          g.appendChild(el('path', { class: 'body', d: shapePath(n, r), fill: hopColor(n) }));
          if (labelVisible(n, !!onPath[n.addr])) {
            var text = el('text', { dy: r + 13 });
            text.textContent = shortName(n.name);
            g.appendChild(text);
          }
          layer.appendChild(g);
          state.placed.push({ node: n, x: p.x, y: p.y });
        });
        svg.appendChild(layer);

        renderCaption(sel);
        renderSummary();
      }

      function renderCaption(n) {
        var box = document.getElementById('caption');
        if (!n) {
          box.hidden = true;
          return;
        }
        box.textContent = '';
        var name = document.createElement('b');
        name.textContent = n.name;
        box.appendChild(name);

        var parts = [];
        if (n.shape === 'controller') {
          if (state.view.channel != null) parts.push('channel ' + state.view.channel);
        } else if (n.hops == null) {
          parts.push('no route');
        } else {
          parts.push(n.hops + (n.hops === 1 ? ' hop' : ' hops'));
          var parent = n.path && state.byAddr[n.path[n.path.length - 2]];
          if (parent) parts.push('via ' + shortName(parent.name));
        }
        if (parts.length) box.appendChild(document.createTextNode(' · ' + parts.join(' · ')));

        if (n.shape !== 'controller' && n.hops != null) {
          var grade = document.createElement('span');
          grade.className = 'q-text-' + n.grade;
          grade.textContent = ' · ' + (n.rate == null || n.grade === 'unknown'
            ? GRADE_LABEL.unknown.toLowerCase()
            : Math.round(n.rate * 100) + '%');
          box.appendChild(grade);
        }
        box.hidden = false;
      }

      function renderSummary() {
        var box = document.getElementById('summary');
        box.hidden = !state.settings.summary;
        if (box.hidden) return;
        box.textContent = '';

        ['bad', 'weak', 'fair', 'good'].forEach(function (g) {
          var count = state.view.grades[g];
          if (!count) return;
          var item = document.createElement('span');
          item.className = 'count';
          item.title = GRADE_LABEL[g];
          var dot = document.createElement('i');
          dot.className = 'dot q-' + g;
          item.appendChild(dot);
          item.appendChild(document.createTextNode(String(count)));
          box.appendChild(item);
        });

        var updated = document.createElement('span');
        updated.className = 'updated';
        updated.textContent = new Date(state.view.generatedAt)
          .toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        box.appendChild(updated);
      }

      // ------------------------------------------------------ interaction --

      /**
       * A tap selects the nearest device within reach, and shows its route; a
       * tap anywhere else clears it. Only a tap: the widget never pans or zooms,
       * so a swipe over it still scrolls the dashboard.
       */
      svg.addEventListener('click', function (e) {
        var rect = svg.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var best = null;
        var bestDist = TAP_RADIUS;
        state.placed.forEach(function (p) {
          var d = Math.hypot(p.x - x, p.y - y);
          if (d < bestDist) {
            best = p.node;
            bestDist = d;
          }
        });
        var addr = best ? best.addr : null;
        state.selected = addr === state.selected ? null : addr;
        if (best && state.homey.hapticFeedback) state.homey.hapticFeedback();
        render();
      });

      document.getElementById('caption').addEventListener('click', function () {
        state.selected = null;
        render();
      });

      var resizeTimer = null;
      function scheduleRender() {
        if (resizeTimer) return;
        resizeTimer = setTimeout(function () {
          resizeTimer = null;
          render();
        }, 100);
      }

      function onHomeyReady(Homey) {
        state.homey = Homey;
        state.settings = Homey.getSettings() || {};

        var minutes = Math.max(1, Math.min(60, Number(state.settings.refresh) || 5));
        var height = HEIGHTS[state.settings.shape] || HEIGHTS.square;

        load().then(function () {
          Homey.ready({ height: height });
        });
        setInterval(load, minutes * 60 * 1000);

        if (window.ResizeObserver) new ResizeObserver(scheduleRender).observe(svg);
        window.addEventListener('resize', scheduleRender);
      }

      window.onHomeyReady = onHomeyReady;
    </script>
  </body>
</html>
